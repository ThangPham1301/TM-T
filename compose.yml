name: goihue
services:
  web:
    build: ./apps/web
    environment:
      API_UPSTREAM_URL: http://api:8088/api/v1
      # Extra browser origins allowed to call the store API (e.g. the public
      # demo tunnel host). Localhost origins are always allowed.
      APP_PUBLIC_ORIGINS: ${APP_PUBLIC_ORIGINS:-https://tmt-web.npanhbao.dev,https://goihue.io.vn,https://www.goihue.io.vn}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: goihue
      POSTGRES_USER: goihue
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run setup.ps1 first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goihue -d goihue"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./apps/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/goihue
      SPRING_DATASOURCE_USERNAME: goihue
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Run setup.ps1 first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run setup.ps1 first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run setup.ps1 first}
      APP_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,${APP_PUBLIC_ORIGINS:-https://tmt-web.npanhbao.dev,https://goihue.io.vn,https://www.goihue.io.vn}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      # Demo VietQR checkout: receiving account shown in the QR payload and
      # the shared secret that signs payment notifications (IPN). Override in
      # .env for anything beyond a local demo.
      APP_BANK_BIN: ${APP_BANK_BIN:-970422}
      APP_BANK_ACCOUNT: ${APP_BANK_ACCOUNT:-012345678901}
      APP_BANK_NAME: ${APP_BANK_NAME:-GOI HUE}
      # Leave empty to disable demo IPN until a secret is configured locally.
      APP_IPN_SECRET: ${APP_IPN_SECRET:-}
      # SePay webhook signing secret (HMAC-SHA256). The value itself lives
      # only in .env (gitignored); see scripts for the Test-mode setup.
      APP_SEPAY_SECRET: ${APP_SEPAY_SECRET:-}
      APP_PAYMENT_TTL_MINUTES: ${APP_PAYMENT_TTL_MINUTES:-15}
      APP_PAYMENT_SWEEP_MS: ${APP_PAYMENT_SWEEP_MS:-60000}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - evidence:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  evidence:
