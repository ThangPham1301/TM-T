# Local demo wiring for the AI assistant (Amazon Bedrock).
#
# Credentials come from the project .env file ONLY: fill in
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY there — .env is
# gitignored, never committed, and no credential lives in the repo.
# The AWS SDK's default credentials chain reads those environment
# variables first. While they are empty, no other credential source
# is wired into the container and the assistant answers with its
# deterministic fallback.
services:
  api:
    environment:
      APP_BEDROCK_MODEL: ${APP_BEDROCK_MODEL:-amazon.nova-lite-v1:0}
      APP_BEDROCK_REGION: ${APP_BEDROCK_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
