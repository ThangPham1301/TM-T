openapi: 3.0.3
info:
  title: Goi Hue Unified Store API
  version: 1.9.0-draft
  description: Unified persistence API. VietQR/IPN operations are experimental demo flows; shipping and refunds are recorded manually. See goihue-state-matrix.md.
servers:
  - url: /api/store
security:
  - Session: []
paths:
  /guest/orders/{number}/support:
    parameters:
      - {in: path, name: number, required: true, schema: {type: string, pattern: '^GH-[A-Z0-9]{8}$'}}
    get:
      operationId: listGuestOrderSupport
      summary: List support requests for a verified guest order
      security: []
      description: Requires the original guest order session or a valid HttpOnly access grant scoped to this exact order.
      responses:
        '200':
          description: Up to 30 latest support requests and replies for the verified order
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/GuestSupportTicket'}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: submitGuestOrderSupport
      summary: Submit a support request for a verified guest order
      security: []
      description: Same order proof as GET and trusted Origin. A retry with the same key and content returns the existing ticket. Only one open ticket per order and topic.
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, message]
              properties:
                topic: {type: string, enum: [DELIVERY, RETURNS, PRIVACY, OTHER]}
                message: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Saved support ticket
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestSupportTicket'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /admin/support:
    get:
      operationId: listGuestSupportInbox
      summary: List guest support requests for staff
      description: ADMIN with order.manage. Tickets include orderNumber. No lookup secrets or recipient details are returned.
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [ALL, SUBMITTED, IN_REVIEW, RESOLVED], default: SUBMITTED}}
        - {in: query, name: page, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
        - {in: query, name: number, schema: {type: string, pattern: '^GH-[A-Z0-9]{8}$'}}
      responses:
        '200': {description: Items and hasMore for a page of up to 30 tickets}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /admin/support/{id}:
    put:
      operationId: respondToGuestSupport
      summary: Reply to a guest support request
      description: ADMIN with order.manage, trusted Origin and current revision. Saves a guest-visible response. A closed request cannot be changed.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reply, revision]
              properties:
                status: {type: string, enum: [IN_REVIEW, RESOLVED]}
                reply: {type: string, minLength: 1, maxLength: 2000}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Updated support ticket}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /orders/{id}/reorder/preview:
    post:
      operationId: previewOrderReorder
      summary: Review current availability and prices before buying an owned past order again
      description: >-
        CUSTOMER with cart.manage; owned authenticated orders only. Allowed source states are DELIVERED,
        CANCELLED, DELIVERY_FAILED and RETURNED. Other source states return 409, including active unpaid orders.
        This is a read-only preview; no cart writes, reservations, orders or payment creation.
        Omit items to select the original quantities. An explicit empty list deselects all lines.
        Only products from the original order may be selected, without duplicates. Unavailable lines remain
        visible using the historical name and are never silently skipped or reduced. Current hidden product
        details are not exposed. The quote uses current effective prices, the best eligible discount and
        post-discount shipping. ready is false until selected quantities are available, order limits are met
        and the store accepts orders. previewToken fingerprints the selection, source revision, current
        product state, shipping and quote. cartToken separately guards replacement of the existing cart.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                items: {$ref: '#/components/schemas/ReorderSelection'}
      responses:
        '200':
          description: Review of all original lines; ready/issue messages, current quote when valid, source recipient, previewToken and current cartToken/count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReorderPreview'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /orders/{id}/reorder:
    post:
      operationId: confirmOrderReorder
      summary: Atomically replace the customer cart with reviewed reorder items
      description: >-
        CUSTOMER with cart.manage; same source eligibility and ownership as the preview operation.
        Requires a current previewToken for the exact selected items and the expected cartToken.
        Revalidates all products, quantities, pricing, discounts, shipping and source state while holding
        the commerce mutation lock. Changed preview or cart returns 409 without modifying the cart.
        Invalid selection returns 422 without modifying the cart. All cart changes and idempotency records
        commit together; a failure rolls back every change. A retry with the same key and body replays
        the same result, and another body with that key returns 409. Never creates an order or copies
        payment state. Checkout must still revalidate the current quote and create a fresh order/payment.
        The checkout UI can prefill recipient/phone/address from the owned source order, labeled as old
        recipient details, without saving them as an address or changing the customer profile.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, previewToken, cartToken]
              properties:
                action: {type: string, enum: [reorder]}
                items: {$ref: '#/components/schemas/ReorderSelection'}
                previewToken: {type: string, pattern: '^[a-f0-9]{64}$'}
                cartToken: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200':
          description: Cart replaced or idempotent result replayed; no order has been placed. measurementMutation contains net quantity changes with a stable operation ID preserved on replay.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sourceOrderId, sourceOrderNumber, measurementMutation]
                properties:
                  ok: {type: boolean}
                  sourceOrderId: {type: string, format: uuid}
                  sourceOrderNumber: {type: string}
                  measurementMutation: {$ref: './ga4-measurement.schema.yaml#/components/schemas/MeasurementMutation'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /guest/cart/summary:
    get:
      operationId: guestCartQuote
      summary: Read the current guest cart and quote
      security: [{GuestCart: []}, {}]
      responses:
        '200':
          $ref: '#/paths/~1cart~1summary/get/responses/200'
  /guest/commerce:
    post:
      operationId: mutateGuestCartOrCheckout
      summary: Update a guest cart or place a guest order
      description: 'Uses the regular quote and stock transaction. First cart-set creates the guest cookie. A valid account session uses regular commerce. Checkout requires manual delivery fields, a current quote, and a live guest cart. Replay with the same idempotency key returns the existing result.'
      security: [{GuestCart: []}, {}]
      parameters:
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, cartToken]
              properties:
                action: {type: string, enum: [cart-set, cart-clear, cart-refresh, checkout]}
                cartToken: {type: string}
                productId: {type: string, format: uuid, description: Required for cart-set}
                quantity: {type: integer, minimum: 0, maximum: 100, description: Required for cart-set}
                priceToken: {type: string, description: Current price token for cart-refresh}
                expectedUnitPrice: {type: integer}
                expectedPriceSource: {type: string}
                quoteToken: {type: string, pattern: '^[a-f0-9]{64}$', description: Required for checkout}
                shippingRevision: {type: integer, description: Required for checkout}
                recipient: {type: string, maxLength: 100, description: Required for checkout}
                phone: {type: string, maxLength: 30, description: Required for checkout}
                address: {type: string, maxLength: 400, description: Required for checkout}
                paymentMethod: {type: string, enum: [COD, VIETQR], default: COD}
      responses:
        '200':
          description: Cart mutation or guest receipt; safe measurement snapshot is present for new orders and measurementMutation for cart changes. Replay preserves the original operation/snapshot.
          content:
            application/json:
              schema: {$ref: './ga4-measurement.schema.yaml#/components/schemas/MeasuredResponse'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /guest/cart/merge:
    post:
      operationId: mergeGuestCart
      summary: Merge the browser's guest cart into the signed-in customer cart
      description: 'Explicit action. Combines quantities and rechecks visibility, stock and prices in one transaction. Stale carts or unavailable quantities leave both carts intact.'
      security: [{Session: [], GuestCart: []}]
      parameters:
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartToken, customerCartToken]
              properties:
                cartToken: {type: string}
                customerCartToken: {type: string}
      responses:
        '200': {description: Both carts were updated or the previous successful merge was replayed}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /guest/orders/latest:
    get:
      operationId: latestGuestOrder
      summary: Find the most recent guest order for this browser
      security: [{GuestCart: []}, {}]
      responses:
        '200': {description: 'Object containing number, or an empty object when there is no session order'}
  /guest/orders/lookup:
    post:
      operationId: lookupGuestOrder
      summary: Exchange a guest order code for one-order access
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, lookupCode]
              properties:
                number: {type: string, pattern: '^GH-[A-Z0-9]{8}$'}
                lookupCode: {type: string, minLength: 32, maxLength: 35}
      responses:
        '200':
          description: Guest order summary (including the delivery contact) and a 30-minute order-scoped access cookie; new orders include the stored identity-free measurement snapshot.
          content:
            application/json:
              schema: {$ref: './ga4-measurement.schema.yaml#/components/schemas/MeasuredResponse'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /guest/orders/{number}:
    get:
      operationId: guestOrderDetail
      summary: Read a guest order using the browser session or an order-scoped access cookie
      security: [{GuestCart: []}, {GuestOrderAccess: []}]
      parameters:
        - {in: path, name: number, required: true, schema: {type: string, pattern: '^GH-[A-Z0-9]{8}$'}}
      responses:
        '200':
          description: 'Items, amounts, statuses, delivery contact (recipient, phone, address) and pending VietQR demo details. New orders also return their stored measurement snapshot; legacy orders are not backfilled. The original guest session receives its lookup code outside measurement. Internal notes are excluded.'
          content:
            application/json:
              schema: {$ref: './ga4-measurement.schema.yaml#/components/schemas/MeasuredResponse'}
        '404': {$ref: '#/components/responses/Error'}
  /live:
    get:
      operationId: subscribeStoreChanges
      summary: Subscribe to committed order and return changes
      description: 'WebSocket Upgrade at same-origin /api/store/live. Browser chooses ws/wss from page protocol and keeps its public port. Next.js proxies upgrades internally to API_WEBSOCKET_UPSTREAM. Requires the session cookie and allowlisted Origin. Events carry state-changed invalidations scoped to owner or admin. Server sends ping frames every 25s and closes revoked sessions. Fetch /state after an event or reconnect.'
      responses:
        '101': {description: 'Authenticated WebSocket connection'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /categories:
    get:
      operationId: activeCategories
      summary: Active categories
      security: []
      responses:
        '200': {description: 'Active categories sorted by sortOrder and name'}
  /admin/categories:
    get:
      operationId: manageCategories
      summary: Manage categories
      responses:
        '200': {description: 'ADMIN catalog.manage; all category records'}
        '403': {$ref: '#/components/responses/Error'}
  /shipping:
    get:
      operationId: shippingSettings
      summary: Shipping settings
      security: []
      responses:
        '200': {description: 'id/code/baseFee/freeShippingThreshold/enabled/revision and optional pauseMessage; threshold zero disables free shipping'}
  /discounts:
    get:
      operationId: publicDiscounts
      summary: List active public discounts
      security: []
      description: Returns current enabled offers ordered by display priority, then start and ID. Product offers require at least one selected product with an active product and category and available stock. Group offers expose the currently available productIds. All times are UTC.
      responses:
        '200':
          description: Offer feed and optional next schedule boundary
          content:
            application/json:
              schema:
                type: object
                required: [offers, asOf]
                properties:
                  offers: {type: array, items: {$ref: '#/components/schemas/PublicDiscount'}}
                  asOf: {type: string, format: date-time}
                  nextChangeAt: {type: string, format: date-time}
  /pricing:
    get:
      operationId: effectiveCatalogPrices
      summary: List effective catalog prices
      security: []
      responses:
        '200':
          description: Effective per-product prices and the next scheduled or daily evaluation boundary.
          content:
            application/json:
              schema:
                type: object
                required: [asOf, nextChangeAt, prices]
                properties:
                  asOf: {type: string, format: date-time}
                  nextChangeAt: {type: string, format: date-time, nullable: true}
                  hasScheduledPrices: {type: boolean, description: Whether an in-stock product currently uses a scheduled price.}
                  prices:
                    type: object
                    additionalProperties: {$ref: '#/components/schemas/EffectivePrice'}
  /admin/pricing:
    get:
      operationId: listPricingRules
      summary: List administrative pricing rules
      description: ADMIN with pricing.manage. Lists all rules with their revision, including paused and ended rules.
      responses:
        '200':
          description: Pricing rules
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PricingRule'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/discounts:
    get:
      operationId: manageDiscounts
      summary: List administrative discounts
      description: ADMIN with discount.manage. Includes paused, scheduled, and ended programs.
      responses:
        '200':
          description: Discount records including ID, revision, and configured enabled flag
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdminDiscount'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /cart/summary:
    get:
      operationId: cartQuote
      summary: Cart quote
      responses:
        '200':
          description: Cart quote from a consistent read-only snapshot. Dynamic Discount applies only to base-price lines and is capped per line by the product floor, which defaults to the base price. Shipping threshold is evaluated on merchandise after discount.
          content:
            application/json:
              schema:
                type: object
                required: [items, cartToken, priceToken, quoteToken, subtotal, discountAmount, netSubtotal, shippingFee, total, shipping]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        price: {type: integer, description: Unit amount last accepted by the customer}
                        currentPrice: {type: integer, description: Effective unit amount included in this quote}
                        currentPricing: {$ref: '#/components/schemas/EffectivePrice'}
                        priceChanged: {type: boolean, description: A change in amount or pricing source requires acceptance}
                  cartToken: {type: string}
                  priceToken: {type: string, description: Identifies the reviewed effective prices and eligibility sources}
                  nextPriceChangeAt: {type: string, format: date-time, nullable: true}
                  pricedAt: {type: string, format: date-time}
                  quoteToken: {type: string}
                  subtotal: {type: integer, format: int64}
                  measurement: {$ref: './ga4-measurement.schema.yaml#/components/schemas/Measurement'}
                  discountAmount: {type: integer, format: int64, description: Actual discount after applying the product floors.}
                  netSubtotal: {type: integer, format: int64}
                  discount:
                    type: object
                    required: [id, revision, name]
                    properties:
                      id: {type: string, format: uuid}
                      revision: {type: integer, minimum: 1}
                      name: {type: string}
                  offerHint:
                    type: object
                    required: [offer, remainingQuantity, remainingAmount]
                    properties:
                      offer: {$ref: '#/components/schemas/PublicDiscount'}
                      remainingQuantity: {type: integer}
                      remainingAmount: {type: integer, format: int64}
                  shippingFee: {type: integer}
                  total: {type: integer, format: int64}
                  shipping: {type: object, description: Shipping settings including revision}
        '401': {$ref: '#/components/responses/Error'}
  /catalog/images/{id}/content:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      operationId: uploadCatalogImage
      summary: Upload catalog image
      description: ADMIN with trusted Origin; intent created using catalog-image-intent command. Immutable completion with same-bytes replay. Decode/re-encode JPEG/PNG, max 5MB/6000px per side/16M pixels.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200': {description: 'Ready image id and public path'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /catalog/images/{id}:
    get:
      operationId: viewCatalogImage
      summary: View catalog image
      security: []
      description: Public only when attached to an active category/product in an active category; otherwise ADMIN required. PNG no-store/nosniff.
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {description: 'Re-encoded PNG content'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /products:
    get:
      operationId: listProducts
      summary: List products
      security: []
      responses:
        '200': {description: Active catalog array. price is the effective unit amount with basePrice and pricing metadata.}
  /products/recommended:
    get:
      operationId: recommendedProducts
      summary: Recommended products
      security: []
      parameters:
        - {in: query, name: surface, required: false, schema: {type: string, enum: [home, product, cart], default: home}}
        - {in: query, name: productId, required: false, schema: {type: string, format: uuid}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 8, default: 4}}
        - {in: query, name: budget, required: false, description: 'VND upper bound. Omitted, zero and negative values mean no budget filter.', schema: {type: integer, maximum: 100000000}}
      responses:
        '200': {description: 'strategy (BOUGHT_TOGETHER then consent-gated PERSONALIZED then POPULAR), surface, items, generatedAt, budgetApplied (positive VND or null), rankingBasis (DELIVERED_ORDERS or CATALOG). Items include effective price, basePrice, pricing metadata, description and deliveredQuantity. Only DELIVERED orders contribute scores. CATALOG or a zero deliveredQuantity does not establish bestseller status. Product/cart context is excluded. Positive budgets filter before ranking; nonpositive values leave filtering disabled. Empty results have items=[]; cart requires the current customer session.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /recommendations/consent:
    get:
      operationId: readRecommendationConsent
      summary: Read recommendation consent
      responses:
        '200': {description: 'Current customer granted, revision, policyVersion; historical marketing consent never grants personalization.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      operationId: setRecommendationConsent
      summary: Set recommendation consent
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted, revision]
              properties:
                granted: {type: boolean}
                revision: {type: integer, minimum: 0}
      responses:
        '200': {description: 'Updated consent and revision'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /agent/consent:
    get:
      operationId: readAgentConsent
      summary: Read agent consent
      responses:
        '200': {description: 'Current customer historyUse, memoryUse, shared consent revision, policyVersion; both default false.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      operationId: setAgentConsent
      summary: Set agent consent
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [historyUse, memoryUse, revision]
              properties:
                historyUse: {type: boolean}
                memoryUse: {type: boolean}
                revision: {type: integer, minimum: 0}
      responses:
        '200': {description: 'Updated consent. Revocation deletes corresponding history/memory atomically. In-flight turns cannot restore data after revision changes.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /agent/history:
    get:
      operationId: readAgentHistory
      summary: Read agent history
      parameters:
        - {in: query, name: conversationId, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Owner-only latest conversationId (or requested UUID), messages (up to 40), memory (budget/recipient/occasion), revision. Assistant messages include productIds (up to eight public references) and purchaseContext (budget scope, recipients, units each, shipping and selection constraints); legacy turns use empty arrays/objects. These are conversation state, separately gated by history consent. Guests receive 401. No other-owner conversation is returned.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      operationId: forgetAgentHistory
      summary: Forget agent history
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      responses:
        '200': {description: 'Delete all owned chat and memory, advance consent revision to invalidate in-flight saves; consent flags preserved.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /agent/chat:
    post:
      operationId: agentChat
      summary: Agent chat
      description: >-
        Nine tools are available, including plan_purchase for verified multi-recipient purchase arithmetic and search_products for public catalog discovery independently of recommendation ranking.
        Search accepts optional query, category code/name, inStockOnly, limit (1..8) and positive budget.
        Its budget is taken only from the current customer message, never silently inherited from older gift preferences.
        Results include items, categories, totalMatches, outOfStockMatches, budgetApplied and code
        (MATCHED, NO_MATCH, OUT_OF_STOCK or UNKNOWN_CATEGORY). Items include categoryName and available.
        Search matches Vietnamese names with or without accents and active category names/codes; inactive products/categories are excluded.
        Visible out-of-stock items can be returned and are explicitly identified, without enabling a cart proposal.
        An answer that invents shipping fees without a verified get_shipping or plan_purchase result in the current turn is replaced with verified tool summaries.
        General gift-selection advice may use common knowledge and conditional recommendations without forcing a catalog lookup.
        Unknown product attributes remain unconfirmed rather than inferred absent; general knowledge is never presented as verified SKU data.
        General references to considering delivery costs are permitted without asserting an unverified amount or free-shipping promise.
        Ambiguous compare_products/add_to_cart references return AMBIGUOUS choices as product cards, without a comparison or cart_proposal event.
        Product tools use effective catalog prices. A cart_proposal includes priceSource so the storefront can revalidate the reviewed unit price before adding the item.
        Only an exact or unique sellable product reference can create a cart proposal; the customer still confirms the actual cart mutation.
        Optional contextProductIds carries up to eight public product references from the last displayed set. Saved owned history takes precedence.
        References such as "one of these two" scope fresh product tools to that set rather than global popularity.
        A shortened or misspelled reference is resolved only with a unique distinguishing name word within that set; ambiguity asks the customer to choose.
        Context never authorizes access to hidden products, private orders or a cart write, and is persisted only with history consent.
        Changing to a new product topic releases the previous set. Current price, stock and visibility are revalidated rather than trusted from history.
        If the final answer names a recognized product outside a resolved conversational set, it is replaced with advice derived from that set's current catalog descriptions.
        A clearly named singular gift recipient implies one person; short clarifications such as "chỉ mẹ thôi" preserve the prior budget and update recipientCount to one.
        Ordinary single-recipient gift advice uses catalog/recommendation lookup. A model-selected plan_purchase is rerouted to that lookup unless the customer's verified constraints require quantity, distribution or total-cost planning.
        plan_purchase uses recipientCount times unitsPerRecipient (at most 100 total units), current prices/stock, and the current single-order shipping configuration.
        Budget scope TOTAL and PER_RECIPIENT are distinct; per-recipient plans also verify a concrete distribution against each recipient's cap.
        The bounded solver considers uniform choices, two-type mixes and a cheapest-stock combination within at most eight candidates; it does not claim exhaustive global preference optimization.
        SAME and DIFFERENT selection requirements are respected; unsupported distribution or separate-address assumptions ask for clarification.
        Parsed customer constraints and validated conversational state are authoritative over invented model budget/count arguments.
        Computed quantities, totals and feasibility replace model rewrites in the final purchase-plan answer. No plan writes the cart or creates an order.
        Plans resolve effective pricing and apply the same best eligible discount, floor limits and post-discount shipping threshold as checkout. Totals describe a new standalone order containing the proposed lines; existing cart contents are not included.
        Unspecified shipping inclusion is disclosed with the verified single-order total, rather than assuming zero shipping cost.
        SSE purchase_context carries the updated constraint object, and purchase_plan carries code, constraints, requiredQuantity, totalBudget, current items/shipping and up to three options.
        Option fields include lines (productId/name/quantity/unitPrice/lineTotal), subtotal, discountAmount, netSubtotal, shippingFee, total, remainingBudget, fitsIncludingShipping, maxRecipientCost and uniform.
        A planning product_cards event includes optional contextProductIds preserving the candidate set while items displays only products used by feasible options.
        Purchase constraints and quote data are persisted only with history consent. Group budgets are not silently written as ordinary preference-memory budgets.
      security: []
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, maxLength: 1000}
                conversationId: {type: string, format: uuid, description: Server supplies a UUID when absent; guest conversation context stays in browser memory.}
                contextProductIds:
                  type: array
                  maxItems: 8
                  items: {type: string, format: uuid}
                  description: Public product references from the last displayed set, not trusted product facts. Unknown or hidden references never broaden a follow-up into the full catalog.
                purchaseContext: {$ref: '#/components/schemas/PurchaseContext'}
                history:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    properties:
                      role: {type: string, enum: [user, assistant]}
                      content: {type: string}
      responses:
        '200':
          description: 'Bounded Bedrock Converse tool loop (max 4 model rounds and 8 tool calls, 60s deadline) or explicit deterministic fallback. Recommendation budget comes from parsed customer context or consented memory; an invented model budget is ignored. Nonpositive budgets never filter products. The recommendation tool accepts a product-name query and recovers names accidentally supplied as productId. Product questions require fresh catalog evidence even if the model first answers without a tool. Two-product comparisons derive names, prices, descriptions, stock and the price difference from retrieved items; insufficient bestseller evidence is disclosed. The compare_products tool resolves two named products against the sellable catalog and emits an SSE comparison event carrying both product cards and the price difference. The add_to_cart tool is proposal-only: it validates product and quantity against live stock and emits an SSE cart_proposal event; the cart itself is written through the storefront commerce API only after the customer confirms in the UI, never by the agent backend. SSE meta identifies provider and conversationId; tool_call/tool_result contain safe execution status, token contains final answer deltas, product_cards and citations derive from tool results, memory describes consented structured preferences, done marks success, error marks failure. No hidden model reasoning is exposed. Completed owned saved turns replay for the same key/body; concurrent requests with the same key return 409. Guests and consent-off turns are never persisted. History is capped at 20 turns per owner. Memory persists until revoked or forgotten. Session is rechecked at completion.'
          content:
            text/event-stream:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /products/{slug}:
    get:
      operationId: productDetail
      summary: Product detail
      security: []
      parameters:
        - {in: path, name: slug, required: true, schema: {type: string}}
      responses:
        '200': {description: 'Product with effective price, basePrice and pricing metadata'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/products:
    get:
      operationId: manageCatalog
      summary: Manage catalog
      responses:
        '200': {description: ADMIN catalog including inactive products with base price and optional priceFloor}
        '403': {$ref: '#/components/responses/Error'}
  /state:
    get:
      operationId: accountState
      summary: Account state
      responses:
        '200': {description: 'User and role-scoped collections including saved addresses for CUSTOMER and audit/policy versions for ADMIN. Each ADMIN audit entry includes id, subject, action, at, and nullable actorName, actorRole, subjectKind and subjectLabel.'}
        '401': {$ref: '#/components/responses/Error'}
  /cart:
    get:
      operationId: currentCart
      summary: Current cart
      responses:
        '200': {description: CUSTOMER cart array with previously accepted price and effective currentPrice/currentPricing}
        '401': {$ref: '#/components/responses/Error'}
  /policy:
    get:
      operationId: currentPrivacyPolicy
      summary: Current published privacy policy (legacy path)
      security: []
      responses:
        '200': {description: Same document and version as GET /policy/privacy}
  /policy/{topic}:
    get:
      operationId: publishedPolicy
      summary: Current published policy with its exact version and Markdown content
      security: []
      parameters:
        - {in: path, name: topic, required: true, schema: {type: string, enum: [privacy, shipping, returns]}}
      responses:
        '200':
          description: The published document read by the storefront and advisor. Drafts are available in ADMIN state only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedPolicy'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/{action}:
    post:
      operationId: authenticate
      summary: Authenticate
      security: []
      description: Trusted Origin. Register grants CUSTOMER only. Logout requires a valid session.
      parameters:
        - {in: path, name: action, required: true, schema: {type: string, enum: [register, login, logout]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 100}
                email: {type: string, format: email, maxLength: 150}
                password: {type: string, format: password, maxLength: 72}
      responses:
        '200': {description: 'Safe user and HttpOnly session cookie, or logout acknowledgement'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /commerce:
    post:
      operationId: commerceMutation
      summary: Commerce mutation
      description: Action-specific fields and permissions are in the state matrix. VietQR requires confirmed payment before packing or dispatch. For unpaid COD, delivery confirmation records collection in the same transaction. Direct order-paid only supplements an already-delivered unpaid COD order.
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Mutation'}
                - type: object
                  properties:
                    pauseMessage: {type: string, maxLength: 250, description: Optional customer-facing notice for shipping-save when new orders are paused}
                    addressId: {type: string, format: uuid, description: Optional saved CUSTOMER destination for checkout in place of manual recipient fields}
                    productIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}, description: Required for discount-save with scope PRODUCTS.}
                    priceToken: {type: string, minLength: 64, maxLength: 64, description: Submit the reviewed price token for cart-refresh. A change returns 409.}
                    expectedUnitPrice: {type: integer, minimum: 1, description: Unit price shown before adding a product. A change returns 409.}
                    expectedPriceSource: {type: string, enum: [BASE, SCHEDULE, STOCK, DEMAND], description: Required with expectedUnitPrice.}
                    type: {type: string, enum: [SCHEDULE, STOCK, DEMAND], description: Rule type for pricing-save.}
                    name: {type: string, maxLength: 90, description: Name for pricing-save.}
                    targets: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/PricingTarget'}}
                    floor: {type: integer, minimum: 1, maximum: 10000000, description: Minimum merchandise unit price after dynamic pricing or cart discounts. Required for pricing-floor and cannot exceed the base price.}
                    threshold: {type: integer, minimum: 0, maximum: 1000000, description: Minimum available stock or maximum confirmed units in three completed days.}
                    startsAt: {type: string, description: UTC ISO timestamp in years 2000–9999 for offers and scheduled pricing rules.}
                    endsAt: {type: string, description: UTC ISO timestamp in years 2000–9999 for offers and scheduled pricing rules.}
                    enabled: {type: boolean, description: Required for pricing-save and pricing-toggle.}
                    quoteToken: {type: string, minLength: 64, maxLength: 64, description: Submit the latest quote token on checkout. A legacy client may omit it only when the current discount is zero. A changed quote returns 409.}
                    phone: {type: string, minLength: 8, maxLength: 30, description: 'Manual checkout/order-recipient phone accepts digits, spaces, +, (), period and hyphen; requires at least eight digits'}
                    paymentMethod: {type: string, enum: [COD, VIETQR], description: Optional; defaults to COD. VietQR is a demo integration.}
                    resolution: {type: string, enum: [PAID_RECORDED, REFUNDED, EXTRA_REFUNDED], description: Outcome for payment-resolve}
                    transactionId: {type: string, maxLength: 100, description: Required for EXTRA_REFUNDED. Identifies the pending additional receipt on this order.}
                    collectedAmount: {type: integer, minimum: 0, description: Required to close an unpaid COD delivery or supplement a legacy delivery. Must equal the current COD amount due.}
                    action: {type: string, enum: [cart-set, cart-clear, cart-refresh, checkout, order-cancel, order-status, order-paid, order-recipient, payment-resolve, product-save, product-delete, category-save, category-delete, catalog-toggle, shipping-save, catalog-image-intent, discount-save, discount-toggle, pricing-save, pricing-toggle, pricing-floor]}
      responses:
        '200':
          description: Persisted record or acknowledgement. New checkout orders include immutable measurement; cart-set/cart-clear include measurementMutation. Replay retains the same data. Other actions keep their existing response.
          content:
            application/json:
              schema: {$ref: './ga4-measurement.schema.yaml#/components/schemas/MeasuredResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /payments/ipn:
    post:
      operationId: demoPaymentNotification
      summary: Demo payment notification
      security: []
      description: Direct backend endpoint for a signed demo notification, not proxied through /api/store. Disabled without APP_IPN_SECRET.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderNumber, amount, transactionId, signature]
              properties:
                orderNumber: {type: string}
                amount: {type: integer, format: int64, minimum: 1}
                transactionId: {type: string}
                signature: {type: string, description: HMAC-SHA256 hex of orderNumber pipe amount pipe transactionId}
      responses:
        '200': {description: 'PAID, DUPLICATE_IGNORED, REVIEW_AMOUNT, REVIEW_LATE or REVIEW_DOUBLE. REVIEW_DOUBLE records an additional receipt without changing the primary payment status.'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /payments/sepay/webhook:
    post:
      operationId: sepayWebhook
      summary: Sepay webhook
      security: []
      description: 'SePay HMAC-SHA256 receiver, reachable publicly at /api/store/payments/sepay/webhook via BFF with original body and signature headers. Does not require browser Origin/session. Requires APP_SEPAY_SECRET and timestamp within 300 seconds. Receiving account must match the order payment snapshot. Stable provider transaction IDs are deduplicated globally across orders, including legacy payment references. Accepts exact integer VND amounts represented as integer or decimal with zero fractional part. Code and content may contain GH-XXXXXXXX or GHXXXXXXXX. Test-mode payloads are supported; a real dashboard delivery must be verified after deployment.'
      parameters:
        - {in: header, name: X-SePay-Signature, required: true, schema: {type: string}}
        - {in: header, name: X-SePay-Timestamp, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, transferType, transferAmount, accountNumber]
              properties:
                id: {oneOf: [{type: integer}, {type: string, pattern: '^[0-9]{1,20}$'}]}
                transferType: {type: string, enum: [in, out]}
                transferAmount: {type: number, minimum: 0}
                accountNumber: {type: string}
                content: {type: string}
                code: {type: string, nullable: true}
      responses:
        '200': {description: 'JSON success=true for accepted, duplicated, foreign-account or unmatched permanent events; business review outcomes do not repeat stock mutations.'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /password:
    post:
      operationId: changePassword
      summary: Change password
      description: Trusted Origin and valid session. Verifies the current password, updates BCrypt hash, and revokes all other sessions. Revoked WebSockets close on the next invalidation or heartbeat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, format: password, maxLength: 72}
                newPassword: {type: string, format: password, minLength: 12, maxLength: 72, description: At most 72 UTF-8 bytes}
      responses:
        '200': {description: 'Password updated'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /command:
    post:
      operationId: platformMutation
      summary: Platform mutation
      description: Profile, consent, privacy, policy and return actions. Each case update requires current revision. Resuming a refund past a payment hold requires confirmed payment. Successful resumes record transition RESUME in history. Full fields are in state matrix.
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Mutation'}
                - type: object
                  properties:
                    action: {type: string, enum: [profile, address-save, address-delete, consent, policy, policy-publish, privacy-create, privacy-update, privacy-supplement, return-create, return-submit, return-update, return-supplement, return-confirm, return-withdraw]}
                    topic: {type: string, enum: [privacy, shipping, returns], description: Policy topic for draft creation or edit. Omitted defaults to privacy for legacy clients.}
                    version: {type: string, maxLength: 40, description: Unique for the policy topic. Immutable when editing an existing draft.}
                    content: {type: string, maxLength: 16000, description: Policy draft Markdown. To edit send its id and revision.}
                    publishedId: {type: string, format: uuid, description: Current published record ID to acknowledge before policy-publish. Also send the candidate id and revision.}
                    isDefault: {type: boolean, description: Optional address-save flag; updates to other default addresses increment their revisions.}
      responses:
        '200': {description: 'Persisted record or acknowledgement'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /evidence/intents:
    post:
      operationId: createEvidenceIntent
      summary: Create evidence intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 120}
      responses:
        '200': {description: 'Owned private fileId; no arbitrary URL accepted'}
  /evidence/{id}/content:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      operationId: completeEvidenceUpload
      summary: Complete evidence upload
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200': {description: 'Private JPEG/PNG up to 5MB, STORED_UNSCANNED'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    get:
      operationId: downloadEvidence
      summary: Download evidence
      responses:
        '200': {description: 'Inline image for owner/ADMIN; no-store/nosniff'}
        '404': {$ref: '#/components/responses/Error'}
  /privacy/{id}/export:
    get:
      operationId: exportAccountData
      summary: Export account data
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {description: 'JSON snapshot after completed ACCESS/EXPORT, owner/ADMIN only'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    Session: {type: apiKey, in: cookie, name: goihue_session}
    GuestCart: {type: apiKey, in: cookie, name: goihue_guest}
    GuestOrderAccess: {type: apiKey, in: cookie, name: goihue_order_access}
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    Idempotency: {in: header, name: Idempotency-Key, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9-]{16,80}$'}}
  schemas:
    ReorderSelection:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required: [productId, quantity]
        properties:
          productId: {type: string, format: uuid}
          quantity: {type: integer, minimum: 1, maximum: 100}
    ReorderPreview:
      type: object
      required: [sourceOrderId, sourceOrderNumber, recipient, lines, ready, issues, previewToken, cartToken, cartCount]
      properties:
        sourceOrderId: {type: string, format: uuid}
        sourceOrderNumber: {type: string}
        recipient:
          type: object
          properties:
            recipient: {type: string}
            phone: {type: string}
            address: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [productId, name, originalQuantity, quantity, previousPrice, available, stock, code]
            properties:
              productId: {type: string, format: uuid}
              name: {type: string}
              image: {type: string}
              originalQuantity: {type: integer}
              quantity: {type: integer, minimum: 0, description: Zero when explicitly not selected}
              previousPrice: {type: integer, description: Historical unit price before line discounts}
              currentPrice: {type: integer, nullable: true}
              priceSource: {type: string, nullable: true}
              priceChanged: {type: boolean}
              available: {type: boolean}
              stock: {type: integer, minimum: 0}
              code: {type: string, enum: [AVAILABLE, INSUFFICIENT_STOCK, OUT_OF_STOCK, UNAVAILABLE]}
        ready: {type: boolean}
        issues: {type: array, items: {type: string}}
        quote:
          type: object
          nullable: true
          description: Available only when every selected line is purchasable; uses current checkout pricing and discounts
          properties:
            subtotal: {type: integer, format: int64}
            discountAmount: {type: integer, format: int64}
            netSubtotal: {type: integer, format: int64}
            shippingFee: {type: integer}
            total: {type: integer, format: int64}
        previewToken: {type: string}
        cartToken: {type: string}
        cartCount: {type: integer, description: Number of existing cart lines that confirmation will replace}
    EffectivePrice:
      type: object
      required: [amount, basePrice, source]
      properties:
        amount: {type: integer, minimum: 1}
        basePrice: {type: integer, minimum: 1}
        source: {type: string, enum: [BASE, SCHEDULE, STOCK, DEMAND]}
        ruleId: {type: string, format: uuid, nullable: true}
        name: {type: string, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
    PricingTarget:
      type: object
      required: [productId, price]
      properties:
        productId: {type: string, format: uuid}
        price: {type: integer, minimum: 1, maximum: 10000000}
    PricingRule:
      type: object
      required: [id, revision, name, type, enabled, threshold, targets]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        name: {type: string, maxLength: 90}
        type: {type: string, enum: [SCHEDULE, STOCK, DEMAND]}
        enabled: {type: boolean}
        startsAt: {type: string, format: date-time, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
        threshold: {type: integer, minimum: 0, maximum: 1000000}
        targets: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/PricingTarget'}}
    DiscountRule:
      type: object
      required: [name, scope, condition, minimum, method, value, startsAt, endsAt, featured, priority]
      properties:
        name: {type: string, maxLength: 90}
        scope: {type: string, enum: [PRODUCT, PRODUCTS, CART]}
        productId: {type: string, description: Product UUID for PRODUCT scope and empty for other scopes}
        productIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
          description: Required with at least one item for PRODUCTS mutations. Public offers list the currently available targets and include the single target for PRODUCT scope.
        condition: {type: string, enum: [QUANTITY, SUBTOTAL]}
        minimum: {type: integer, minimum: 1, maximum: 100000000, description: Minimum units or VND in the selected scope}
        method: {type: string, enum: [PERCENT, FIXED]}
        value: {type: integer, minimum: 1, maximum: 100000000, description: Percent 1–100 or fixed whole VND capped by eligible merchandise}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        featured: {type: boolean}
        priority: {type: integer, minimum: 0, maximum: 999}
        message: {type: string, maxLength: 120}
    AdminDiscount:
      allOf:
        - {$ref: '#/components/schemas/DiscountRule'}
        - type: object
          required: [id, revision, enabled]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer, minimum: 1}
            enabled: {type: boolean}
    PublicDiscount:
      allOf:
        - {$ref: '#/components/schemas/DiscountRule'}
        - type: object
          required: [id, revision, productName, productSlug]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer, minimum: 1}
            productName: {type: string}
            productSlug: {type: string}
    PurchaseContext:
      type: object
      additionalProperties: false
      description: Optional conversational constraints. Current explicit customer changes override prior values; owned saved history takes precedence over client state. Does not authorize prices, inventory or mutations.
      properties:
        budget: {type: integer, minimum: 1, maximum: 100000000}
        budgetScope: {type: string, enum: [TOTAL, PER_RECIPIENT], default: TOTAL}
        recipientCount: {type: integer, minimum: 1, maximum: 100}
        unitsPerRecipient: {type: integer, minimum: 1, maximum: 100, default: 1}
        shippingInBudget: {type: string, enum: [UNSPECIFIED, INCLUDED, EXCLUDED], default: UNSPECIFIED}
        selectionMode: {type: string, enum: [ANY, SAME, DIFFERENT], default: ANY}
    GuestSupportTicket:
      type: object
      required: [id, topic, status, message, reply, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        topic: {type: string, enum: [DELIVERY, RETURNS, PRIVACY, OTHER]}
        status: {type: string, enum: [SUBMITTED, IN_REVIEW, RESOLVED]}
        message: {type: string}
        reply: {type: string}
        revision: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PublishedPolicy:
      type: object
      required: [id, topic, title, version, status, content, revision, publishedAt]
      properties:
        id: {type: string, format: uuid}
        topic: {type: string, enum: [privacy, shipping, returns]}
        title: {type: string}
        version: {type: string}
        status: {type: string, enum: [PUBLISHED]}
        content: {type: string, maxLength: 16000}
        revision: {type: integer}
        publishedAt: {type: string, format: date-time}
    Mutation:
      type: object
      required: [action]
      additionalProperties: true
      properties:
        action: {type: string}
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        note: {type: string, maxLength: 2000}
        reference: {type: string, maxLength: 200}
        productId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        lineId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 0, maximum: 100}
        cartToken: {type: string, minLength: 64, maxLength: 64}
        shippingRevision: {type: integer, minimum: 1}
        imageId: {type: string, description: Empty clears image; absent preserves current image; UUID references a READY catalog upload}
        images: {type: array, maxItems: 10, items: {type: string, maxLength: 300}, description: Optional product gallery for product-save; the first entry becomes the primary image field; absent preserves the current gallery}
        kind: {type: string, enum: [product, category]}
        code: {type: string, maxLength: 120}
        sortOrder: {type: integer, minimum: 0, maximum: 10000}
        baseFee: {type: integer, minimum: 0, maximum: 1000000}
        freeShippingThreshold: {type: integer, minimum: 0, maximum: 100000000}
        enabled: {type: boolean}
        evidenceIds: {type: array, maxItems: 5, description: Owned evidence IDs for return-create or return-supplement; the case total cannot exceed five images., items: {type: string, format: uuid}}
  responses:
    Error:
      description: Safe error; BFF may use 503 when upstream unavailable.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              code: {type: string}
              message: {type: string}
              requestId: {type: string}
