openapi: 3.0.3
info:
  title: Gói Huế safe commerce measurement
  version: 1.0.0
servers:
  - url: /api/store
paths: {}
components:
  schemas:
    MeasurementItem:
      type: object
      additionalProperties: false
      required: [productId, name, categoryCode, quantity, unitPrice, priceSource, lineDiscountAmount, lineNetTotal]
      properties:
        productId: {type: string, format: uuid}
        name: {type: string}
        categoryCode: {type: string}
        quantity: {type: integer, minimum: 1}
        unitPrice: {type: integer, minimum: 0}
        priceSource: {type: string, enum: [BASE, SCHEDULE, STOCK, DEMAND]}
        lineDiscountAmount: {type: integer, minimum: 0}
        lineNetTotal: {type: integer, minimum: 0}
    Measurement:
      type: object
      additionalProperties: false
      description: Immutable order snapshot, or current quote snapshot. No identity, recipient, lookup code, token or payment payload. No backfill of historical orders.
      required: [schemaVersion, currency, subtotal, discountAmount, netSubtotal, shippingFee, total, items]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        currency: {type: string, enum: [VND]}
        transactionId: {type: string, description: 'Order number, present only on an order'}
        paymentMethod: {type: string, enum: [COD, VIETQR]}
        subtotal: {type: integer, minimum: 0}
        discountAmount: {type: integer, minimum: 0}
        netSubtotal: {type: integer, minimum: 0}
        shippingFee: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        discount:
          type: object
          additionalProperties: false
          required: [id, revision, name]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer}
            name: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/MeasurementItem'}
    MeasurementMutation:
      type: object
      additionalProperties: false
      description: Created for successful cart-set/cart-clear or atomic reorder confirmation. Stable operationId on idempotency replay. Quantities are absolute; analytics sends only their net delta.
      required: [schemaVersion, operationId, changes]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        operationId: {type: string, format: uuid}
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [productId, name, categoryCode, previousQuantity, newQuantity, effectiveUnitPrice, priceSource]
            properties:
              productId: {type: string, format: uuid}
              name: {type: string}
              categoryCode: {type: string}
              previousQuantity: {type: integer, minimum: 0}
              newQuantity: {type: integer, minimum: 0}
              effectiveUnitPrice: {type: integer, minimum: 0}
              priceSource: {type: string, enum: [BASE, SCHEDULE, STOCK, DEMAND]}
    MeasuredResponse:
      type: object
      additionalProperties: true
      properties:
        measurement: {$ref: '#/components/schemas/Measurement'}
        measurementMutation: {$ref: '#/components/schemas/MeasurementMutation'}
